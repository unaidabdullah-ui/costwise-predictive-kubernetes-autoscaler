name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy autoscaler costwise common marketplace workload_generator ml/src/lite.py ml/src/numpy_lstm.py
      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          docker build -f docker/control-plane/Dockerfile -t costwise-control-plane .
          docker build -f docker/marketplace/Dockerfile -t costwise-marketplace .
