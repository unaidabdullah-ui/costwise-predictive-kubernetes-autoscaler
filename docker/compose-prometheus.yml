# Prometheus config for docker-compose.yml (service names instead of Kubernetes discovery).
global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/rules/costwise-alerts.yml]
scrape_configs:
  - job_name: marketplace
    static_configs: [{targets: ["marketplace:8080"], labels: {pod: compose-marketplace}}]
  - job_name: traffic-generator
    static_configs: [{targets: ["traffic-generator:8089"]}]
