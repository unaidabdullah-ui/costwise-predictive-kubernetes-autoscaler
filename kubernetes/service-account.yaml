# Identity of the CostWise controller. start-demo issues a short-lived (12 h)
# token for it (`kubectl create token`) and writes a kubeconfig to .costwise/;
# the Minikube admin credentials are never used by the controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-aware-autoscaler
  namespace: costwise
  labels:
    app.kubernetes.io/name: costwise-controller
    app.kubernetes.io/part-of: costwise
automountServiceAccountToken: false
