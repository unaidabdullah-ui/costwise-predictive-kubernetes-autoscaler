# OPTIONAL Grafana (start-demo.ps1 -WithGrafana, ~100-150 MiB RAM).
# Anonymous read-only Viewer access, login form disabled, no password stored anywhere;
# reachable only through the local port-forward (127.0.0.1:3000).
# Generated parts (dashboard JSON) come from grafana/generate_dashboard.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: costwise
  labels: {app.kubernetes.io/part-of: costwise}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: costwise
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: costwise
  labels: {app.kubernetes.io/part-of: costwise}
data:
  costwise.json: |
    {
      "uid": "costwise",
      "title": "CostWise - Marketplace (Prometheus)",
      "schemaVersion": 39,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "5s",
      "tags": [
        "costwise"
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second (shop API)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(marketplace_http_requests_total{route=~\"/api/.*\"}[30s]))",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency (ms)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(marketplace_http_request_duration_seconds_bucket{route=~\"/api/.*\"}[1m])))",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Marketplace pods scraped",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{job=\"marketplace\"} == 1)",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Error ratio (5xx incl. 503 load shedding)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "costwise:marketplace_error_ratio:1m",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU per pod (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(process_cpu_seconds_total{job=\"marketplace\"}[1m]))",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requests per second by pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(marketplace_http_requests_total{route=~\"/api/.*\"}[30s]))",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Simulated shoppers",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(generator_active_shoppers)",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Shopper outcomes per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (outcome) (rate(generator_requests_total[30s]))",
              "legendFormat": "{{pod}}{{outcome}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: costwise
  labels: {app: grafana, app.kubernetes.io/part-of: costwise}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana, app.kubernetes.io/part-of: costwise}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana/data}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/costwise.json}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana/data}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: costwise
  labels: {app: grafana, app.kubernetes.io/part-of: costwise}
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
